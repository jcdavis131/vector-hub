[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-bench"
version = "0.1.0"
description = "Honest outperformance benchmark harness for the vector-* model fleet (baseline ladder + scorecard)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "vector fleet" }]
dependencies = [
    "numpy>=1.24",
    "vector-core @ git+https://github.com/jcdavis131/vector-hub.git#subdirectory=packages/vector-core",
]

[project.optional-dependencies]
# scikit-learn powers most of the prediction ladder (Ridge/KNN/HistGBM/MLP) and
# the PCA retrieval rungs. numpy-only baselines run without it. Effectively
# required to exercise the full ladder — CI installs it.
sklearn = ["scikit-learn>=1.1"]
# torch is ONLY needed to TRAIN a vector-core MTNN on CPU (MTNNRung mode "train").
# The precomputed-embeddings/predictions mode needs no torch.
torch = ["torch>=2.0"]
dev = ["pytest>=7.0", "ruff>=0.4", "scikit-learn>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
