name: gateway

# Scoped CI: validate only the served gateway contract and its own gate.
on:
  push:
    paths:
      - "public/**"
      - "vercel.json"
      - "README.md"
      - "spec/vector-hub-real-product-gateway.md"
      - "scripts/check_gateway.py"
      - "tests/**"
      - ".github/workflows/gateway.yml"
  pull_request:
    paths:
      - "public/**"
      - "vercel.json"
      - "README.md"
      - "spec/vector-hub-real-product-gateway.md"
      - "scripts/check_gateway.py"
      - "tests/**"
      - ".github/workflows/gateway.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check served gateway
        run: python scripts/check_gateway.py

      - name: Test gateway checker
        run: python -m unittest discover -s tests -p "test_gateway*.py" -v
