<script>
const OKABE=['#000000','#E69F00','#56B4E9','#009E73','#F0E442','#0072B2','#D55E00','#CC79A7'];
function lcg(s){return (Math.imul(s,1103515245)+12345>>>0)&0x7fffffff;}
function dailyKey(){
  const qs=new URLSearchParams(location.search);
  let d=qs.get('daily');
  if(!d){
    const now=new Date();
    const y=now.getFullYear(), m=String(now.getMonth()+1).padStart(2,'0'), day=String(now.getDate()).padStart(2,'0');
    d=y+m+day;
  }
  return d;
}
function dailySeeds(dateStr, count, max){
  let seedInt=parseInt(dateStr,10)||20260813;
  let s=lcg(seedInt);
  let out=[];
  for(let i=0;i<count;i++){s=lcg(s);out.push(s % max);}
  return {dailySeed:s, chain:out, seedInt, s0:lcg(seedInt)};
}
function vib(n){try{if(navigator.vibrate) navigator.vibrate(n);}catch{}}
function confettiBurst(){
  const cv=document.getElementById('confetti');
  const ctx=cv.getContext('2d');
  cv.width=innerWidth; cv.height=innerHeight;
  const parts=[];
  for(let i=0;i<80;i++) parts.push({x:cv.width/2+ (Math.random()-0.5)*200, y:cv.height/2, vx:(Math.random()-0.5)*8, vy:-4-Math.random()*6, r:2+Math.random()*4, col: (i%3==0?'#D8452A': i%3==1?'#fff':'#E69F00'), life:60+Math.random()*30});
  let f=0;
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    f++;
    for(const p of parts){
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life--;
      ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    if(parts.some(p=>p.life>0) && f<120) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  }
  tick();
}
function streakUpdate(key){
  const lsPrefix='wm-'+key;
  const d=dailyKey();
  const last=localStorage.getItem(lsPrefix+'-last');
  let streak=parseInt(localStorage.getItem(lsPrefix+'-streak')||'0',10);
  if(last!==d){
    if(last){
      const prev=new Date(last.slice(0,4)+'-'+last.slice(4,6)+'-'+last.slice(6,8));
      const cur=new Date(d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8));
      const diff=Math.round((cur-prev)/86400000);
      if(diff===1) streak=Math.min(7,streak+1); else if(diff>1) streak=1; else if(!streak) streak=1;
    } else streak=1;
    localStorage.setItem(lsPrefix+'-last',d);
    localStorage.setItem(lsPrefix+'-streak',String(streak));
  }
  return {streak, d};
}
function renderDots(el, streak){
  el.innerHTML='';
  for(let i=0;i<7;i++){const dot=document.createElement('span');dot.className='dot'+(i<streak?' on':'');el.appendChild(dot);}
}
function shareLink(){
  const d=dailyKey();
  const n=new URLSearchParams(location.search).get('n')||'1';
  const url=location.origin+location.pathname+'?daily='+d+'&n='+n;
  if(navigator.clipboard) navigator.clipboard.writeText(url);
  vib(10);
  const p=document.getElementById('seedPill'); p.textContent='copied '+d+' n='+n; setTimeout(()=>p.textContent=d+' idx'+' · LCG',2000);
}
document.getElementById('btnShare').addEventListener('click',()=>{
  const d=dailyKey();
  const n=new URLSearchParams(location.search).get('n')||'1';
  const title=document.title;
  if(navigator.share){navigator.share({title, url: location.href}).catch(()=>shareLink());} else shareLink();
});
document.getElementById('btnCopy').addEventListener('click',shareLink);
document.getElementById('seedPill').textContent='hub '+dailyKey();
</script>
